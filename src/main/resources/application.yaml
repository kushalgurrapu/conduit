spring:
  application:
    name: durable-workflow-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/durable_workflow}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:workflow}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health, info
